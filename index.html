<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Seurat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  #start, #status { z-index: 1; }  /* above the canvas, which is added after them */
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.35); color: #fff;
    font: 500 15px/1.4 -apple-system, "Malgun Gothic", system-ui, sans-serif; letter-spacing: .08em; cursor: pointer;
    transition: opacity .6s; }
  #start span { padding: 12px 22px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; }
  #start[hidden], #status[hidden] { display: none; }
  #status { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); width: 8px; height: 8px;
    margin-left: -4px; border-radius: 50%; background: #fff; animation: pulse 1s ease-in-out infinite; pointer-events: none; }
  @keyframes pulse { 50% { opacity: .2; transform: scale(.6); } }
  /* phone controls: two small see-through buttons, bottom left */
  #ui { position: fixed; z-index: 1; left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; }
  #ui[hidden] { display: none; }
  #ui button { width: 38px; height: 38px; padding: 0; border: 1px solid rgba(255,255,255,.28); border-radius: 50%;
    background: rgba(0,0,0,.22); color: rgba(255,255,255,.85); display: grid; place-items: center; cursor: pointer;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); touch-action: manipulation; transition: background .2s; }
  #ui button:active { background: rgba(255,255,255,.25); }
  #ui svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* desktop: Y opens a small code field, centre screen */
  #code { position: fixed; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; }
  #code[hidden] { display: none; }
  #code input { width: 200px; padding: 10px 18px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
    background: rgba(0,0,0,.3); color: #fff; font: 500 15px/1.2 -apple-system, "Malgun Gothic", system-ui, sans-serif;
    letter-spacing: .12em; text-align: center; outline: none; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #code.wrong input { animation: shake .35s; border-color: rgba(255,120,120,.6); }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  #pause .play, #pause.paused .bars { display: none; }
  #pause.paused .play { display: block; }
</style>
</head>
<body>
<div id="status"></div>
<div id="start"><span>TAP TO ENTER</span></div>
<form id="code" hidden autocomplete="off"><input id="code-in" type="text" spellcheck="false" aria-label="Code"></form>
<div id="ui" hidden>
  <button id="pause" aria-label="Pause">
    <svg class="bars" viewBox="0 0 16 16"><path d="M5 3v10M11 3v10"/></svg>
    <svg class="play" viewBox="0 0 16 16"><path d="M5 3l8 5-8 5z" fill="currentColor"/></svg>
  </button>
  <button id="reset" aria-label="Back to start">
    <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M12.5 1.5v3h-3"/></svg>
  </button>
</div>
<script type="module" src="app.76541138.js"></script>
</body>
</html>
