<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Seurat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  #start, #status { z-index: 1; }  /* above the canvas, which is added after them */
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.35); color: #fff;
    font: 500 15px/1.4 -apple-system, "Malgun Gothic", system-ui, sans-serif; letter-spacing: .08em; cursor: pointer;
    transition: opacity .6s; }
  #start span { padding: 12px 22px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; }
  #start[hidden], #status[hidden] { display: none; }
  #status { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); width: 8px; height: 8px;
    margin-left: -4px; border-radius: 50%; background: #fff; animation: pulse 1s ease-in-out infinite; pointer-events: none; }
  @keyframes pulse { 50% { opacity: .2; transform: scale(.6); } }
</style>
</head>
<body>
<div id="status"></div>
<div id="start"><span>TAP TO ENTER</span></div>
<script type="module" src="app.js"></script>
</body>
</html>
